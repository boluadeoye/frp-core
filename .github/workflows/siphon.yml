name: Testnet Siphon
on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  mine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute PoW Siphon
        run: |
          # This script will solve the faucet's math puzzle
          # and send the 0.5 ETH to your wallet.
          node scripts/pow_solver.js
        env:
          TARGET_WALLET: "0xF039Dc10b1Eb92601d0F76FDF67442dA7aBF51D7"
